cluster_only: false
recipe_version: '1'
solo_only: false

defaults:
  max_num_batched_tokens: 32768
  max_model_len: 262144
  host: 0.0.0.0
  num_speculative_tokens: 2
  gpu_memory_utilization: 0.7
  max_num_seqs: 2
  port: 8000
  chat_template: chat_template.jinja
  tokenizer_mode: auto
  served_model_name: gx10 qwen3.6-35b-a3b

env:
  TRANSFORMERS_OFFLINE: '1'
  VLLM_MARLIN_USE_ATOMIC_ADD: '1'
  VLLM_HTTP_TIMEOUT_KEEP_ALIVE: '600'
  HF_HUB_OFFLINE: '1'
  FLASHINFER_DISABLE_VERSION_CHECK: '1'
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: '1'
  TORCH_MATMUL_PRECISION: high
  NVIDIA_FORWARD_COMPAT: '1'
  NVIDIA_DISABLE_REQUIRE: '1'
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'
  
  VLLM_USE_FLASHINFER_MOE_FP4: '0'
  VLLM_FP8_MOE_BACKEND: flashinfer_cutlass
  CUTE_DSL_ARCH: sm_121a

mods:
  - mods/fix-qwen3.5-autoround
  - mods/fix-qwen3-coder-next
  - mods/fix-qwen3.6-chat-template

model: nvidia/Qwen3.6-35B-A3B-NVFP4
description: nvidia/Qwen3.6-35B-A3B-NVFP4 with native MTP speculation, FP8 KV cache, FlashInfer attention, long-context Spark profile
name: nvidia/Qwen3.6-35B-A3B-NVFP4
container: vllm-node
command: |
  vllm serve nvidia/Qwen3.6-35B-A3B-NVFP4 \
    --host {host} \
    --port {port} \
    --served-model-name {served_model_name} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seqs {max_num_seqs} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --dtype auto \
    --tokenizer-mode {tokenizer_mode} \
    --moe_backend auto \
    --load-format instanttensor \
    --attention-backend flashinfer \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --trust-remote-code \
    --chat-template {chat_template} \
    --quantization compressed-tensors \
    --kv-cache-dtype fp8 \
    --reasoning-parser qwen3 \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --optimization-level 3 \
    --performance-mode throughput \
    --default-chat-template-kwargs '{{"preserve_thinking":true}}' \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":{num_speculative_tokens}}}' \
    --override-generation-config '{{"temperature":0.6,"top_p":0.95,"top_k":20,"min_p":0.0,"presence_penalty":1.1,"repetition_penalty":1.01}}'
